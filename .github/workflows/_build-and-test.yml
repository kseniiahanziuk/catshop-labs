name: _build-and-test

on:
  workflow_call:
    inputs:
      context:
        description: Folder with the Dockerfile, requirements and tests
        type: string
        required: true
      python-version:
        description: Python used to run the unit tests
        type: string
        default: "3.12"
      image:
        description: Image name without a tag, e.g. ghcr.io/owner/catshop-lab-03
        type: string
        required: true
      push:
        description: Push the image to the registry, or only build it
        type: boolean
        default: false
    outputs:
      image:
        description: The image name that was built
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: sha256 digest of the built image
        value: ${{ jobs.build.outputs.digest }}

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.context }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles(format('{0}/requirements*.txt', inputs.context)) }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ inputs.python-version }}-
      - uses: ./.github/actions/python-env
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.context }}
          requirements: requirements.txt requirements-dev.txt
      - run: python -m pytest tests -q

  build:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ inputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.context }}
          cache-to: type=gha,mode=max,scope=${{ inputs.context }}
