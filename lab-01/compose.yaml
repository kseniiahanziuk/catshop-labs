services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://shop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/shop
      PARTNER_URL: http://partner:8080
    depends_on:
      db:
        condition: service_healthy
      partner:
        condition: service_started
    networks: [frontend, backend, partnernet]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend]

  partner:
    image: wiremock/wiremock:3.6.0
    command: ["--verbose", "--disable-banner"]
    volumes:
      - ./partner/mappings:/home/wiremock/mappings:ro
    networks: [partnernet]

volumes:
  pgdata:

networks:
  frontend:
  backend:
    internal: true
  partnernet:
    internal: true
