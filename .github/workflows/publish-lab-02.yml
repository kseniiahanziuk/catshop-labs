name: publish-lab-02

on:
  push:
    paths:
      - "lab-02/**"
      - "!lab-02/published.txt"
      - ".github/workflows/publish-lab-02.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q

  publish:
    # A separate job that only starts if every job in `needs` succeeded.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: lab-02
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/catshop:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Published reference
        run: echo "ghcr.io/${{ github.repository_owner }}/catshop@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"